name: Desktop

# tag 推送出正式资产；手动入口只补包到已存在的 Release，不建 Release
# 键名加引号：`on` 在 YAML 1.1 里会被解析成布尔值，引号能让任何解析器都认
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "目标 Release 的 tag，例如 v0.0.1"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # 锁 22.04：AppImage 的最低 glibc 跟随 runner，latest 会让老发行版报 GLIBC 缺失
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # 手动触发时 ref 是分支名，tag 只能用输入值；tag 推送时两者等价
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上链接 webkit2gtk 等系统库，缺了编译直接失败
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # beforeBuildCommand 已经跑了前端构建，这里不重复 npm run build
      # `--` 是 npm 的透传分隔符，后面的参数原样交给 tauri CLI
      # 叠加 --config 才产出更新包与 .sig；缺签名私钥时 tauri CLI 直接失败，不会发无签名包
      - name: Build deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles deb,appimage --config src-tauri/tauri.updater.conf.json

      # 打包产物名带空格，GitHub 会归一化成 %20，而 latest.json 的 url 必须逐字一致；
      # 所以先复制成无空格的名字，manifest job 只认这些名字
      - name: Stage release assets
        run: |
          version="${TAG#v}"
          mkdir -p release-assets
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          cp "$appimage" "release-assets/agent-config-sync-${version}-linux-x86_64.AppImage"
          cp "$appimage.sig" "release-assets/agent-config-sync-${version}-linux-x86_64.AppImage.sig"
          cp "$deb" "release-assets/agent-config-sync-${version}-linux-amd64.deb"
          cp "$deb.sig" "release-assets/agent-config-sync-${version}-linux-amd64.deb.sig"
          ls -l release-assets

      # upload 失败时仍留一份可下载产物，便于排查是不是打包或权限问题
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-assets-linux
          path: release-assets/
          if-no-files-found: warn

      # release 流水线并行创建 Release，可能比本任务晚就绪，所以轮询等待
      - name: Wait for Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 10); do
            if gh release view "$TAG" --json tagName >/dev/null; then
              echo "release $TAG 已就绪"
              exit 0
            fi
            echo "第 $attempt 次探测未找到 release $TAG，6 秒后重试"
            sleep 6
          done
          echo "release $TAG 始终未出现，无法上传资产" >&2
          exit 1

      # 只传安装包与 .sig；latest.json 由 manifest job 最后传，出现即代表本次发布可更新
      - name: Upload assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release-assets/* --clobber

  windows:
    # 只在 Windows 上出包（官方不推荐交叉编译）；runner 自带 WebView2 与 MSVC 工具链，无需装系统库
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # 手动触发时 ref 是分支名，tag 只能用输入值；tag 推送时两者等价
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # Windows 行为的唯一自动化验证点：带 #[cfg(unix)] 的用例在这里不编译
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      # beforeBuildCommand 已经跑了前端构建，这里不重复 npm run build
      # 安装模式取 schema 默认（currentUser，装到 %LOCALAPPDATA%），不写 perMachine
      # 叠加 --config 才产出更新包与 .sig；缺签名私钥时 tauri CLI 直接失败，不会发无签名包
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.updater.conf.json

      # 同 linux：产物名带空格，先复制成无空格的名字再上传
      # 用 bash（runner 自带 Git Bash）：与 linux job 同一份逻辑，也避开 pwsh 对原生命令退出码的处理差异
      - name: Stage release assets
        shell: bash
        run: |
          version="${TAG#v}"
          mkdir -p release-assets
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          cp "$setup" "release-assets/agent-config-sync-${version}-windows-x86_64-setup.exe"
          cp "$setup.sig" "release-assets/agent-config-sync-${version}-windows-x86_64-setup.exe.sig"
          ls -l release-assets

      # upload 失败时仍留一份可下载产物，便于排查是不是打包或权限问题
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-assets-windows
          path: release-assets/
          if-no-files-found: warn

      # release 流水线并行创建 Release，可能比本任务晚就绪，所以轮询等待
      - name: Wait for Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            if gh release view "$TAG" --json tagName >/dev/null; then
              echo "release $TAG 已就绪"
              exit 0
            fi
            echo "第 $attempt 次探测未找到 release $TAG，6 秒后重试"
            sleep 6
          done
          echo "release $TAG 始终未出现，无法上传资产" >&2
          exit 1

      # 只传安装包与 .sig；latest.json 由 manifest job 最后传，出现即代表本次发布可更新
      - name: Upload assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$TAG" release-assets/* --clobber

  manifest:
    # latest.json 是客户端“有新版本”的唯一开关：两边安装包都在 Release 上之后才生成，并且最后传
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 手动触发时 ref 是分支名，tag 只能用输入值；tag 推送时两者等价
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      # 资产名从实际文件读，不手写；缺任一个 .sig 直接失败
      - name: Generate latest.json
        run: node scripts/updater-manifest.mjs --tag "$TAG" --dir release-assets --out latest.json

      # release 流水线并行创建 Release，可能比本任务晚就绪，所以轮询等待
      - name: Wait for Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 10); do
            if gh release view "$TAG" --json tagName >/dev/null; then
              echo "release $TAG 已就绪"
              exit 0
            fi
            echo "第 $attempt 次探测未找到 release $TAG，6 秒后重试"
            sleep 6
          done
          echo "release $TAG 始终未出现，无法上传资产" >&2
          exit 1

      # latest.json 出现即代表可更新，所以先确认它引用的每个资产真能下载；刚上传的资产有 CDN 延迟，留重试
      - name: Probe asset URLs
        run: |
          urls=$(node -e 'const m=JSON.parse(require("node:fs").readFileSync("latest.json","utf8"));for(const p of Object.values(m.platforms))console.log(p.url)')
          for url in $urls; do
            for attempt in $(seq 1 10); do
              if curl -fsSIL -o /dev/null "$url"; then
                echo "可下载：$url"
                continue 2
              fi
              echo "第 $attempt 次探测失败：$url"
              sleep 6
            done
            echo "::error::资产不可下载：$url"
            exit 1
          done

      - name: Upload latest.json to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" latest.json --clobber
