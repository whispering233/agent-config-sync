name: CI

# 只在 main 与 PR 上跑；tag 由 release 流水线负责，避免同一次发布重复构建
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # 锁 22.04：与出包 runner 保持一致，老发行版的 glibc 兼容性才可信
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上编译需要 webkit2gtk 等系统库，缺了 cargo check 直接失败
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # 前端构建含 tsc -b，先过类型检查再进入 Rust 侧
      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    # PR 阶段提前暴露 Windows 编译/测试问题；真正的 NSIS 出包在 desktop.yml
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # 带 #[cfg(unix)] 的用例在 Windows 上不编译，正好验证平台分支
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
