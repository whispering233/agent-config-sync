[package]
name = "agent-config-sync"
version = "0.0.1"
description = "Pi CLI 配置同步桌面工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
